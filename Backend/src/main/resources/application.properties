# ── Server ────────────────────────────────────────────────────────────────────
server.port=8085
spring.application.name=ceb-increment-system

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ceb_increment_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.templates.es-ap-form=templates/Apprisal_ES.docx
app.templates.skilled-ap-form=templates/Apprisal_Skilled_TM.docx
#app.templates.certificate=templates/Increment_Certificate_ES.docx
app.templates.tech-certificate=templates/Incerment_Certificate_Technical_Staff.docx
app.templates.output-dir=generated/
app.python.script=scripts/fill_form.py

# ── SMS (Dialog RichCommunication API v4.2.1) ────────────────────────────────
# SMS is DISABLED by default. Enable only after testing and confirming the sender ID.
dialog.sms.enabled=${DIALOG_SMS_ENABLED:true}
dialog.sms.username=${DIALOG_SMS_USERNAME:}
dialog.sms.password=${DIALOG_SMS_PASSWORD:}
# The mask/sender ID must be approved for the Dialog account.
dialog.sms.mask=${DIALOG_SMS_MASK:EDL-HR}

# ── UTF-8 / Sinhala + Tamil SMS support ───────────────────────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8
server.tomcat.uri-encoding=UTF-8
spring.jackson.time-zone=Asia/Colombo

# ── CORS (React dev server) ───────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.lk.ceb=DEBUG
logging.level.org.springframework.web=INFO
